<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal notes">
  <link rel="alternate" type="application/rss+xml" title="notes" href="/feed.xml">
  <title>notes</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fafafa;
      color: #111;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      line-height: 1.6;
    }

    main {
      width: min(65ch, calc(100% - 2rem));
      margin: 3rem auto 6rem;
    }

    header.site-header {
      margin-bottom: 3rem;
    }

    header.site-header h1 {
      margin: 0 0 .25rem;
      font-size: 1rem;
      font-weight: 700;
    }

    header.site-header a {
      color: inherit;
    }

    article {
      margin: 0 0 4rem;
      scroll-margin-top: 2rem;
    }

    article > header {
      margin-bottom: 1rem;
    }

    article time {
      color: #666;
    }

    article h2 {
      margin: .25rem 0 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .body {
      white-space: normal;
      overflow-wrap: break-word;
    }

    strong {
      font-weight: 700;
    }

    code {
      background: #eee;
      padding: 0 .15em;
    }

    footer {
      border-top: 1px solid #ccc;
      padding-top: 1rem;
      color: #666;
    }

    footer a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <header class="site-header">
      <h1>notes</h1>
      <a href="/feed.xml">rss</a>
    </header>

    <!-- NOTES -->

    <footer>
      <a href="/feed.xml">feed.xml</a>
    </footer>
  </main>
</body>
</html>
